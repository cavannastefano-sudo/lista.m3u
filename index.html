<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- HLS.js per la riproduzione m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Manifest per installazione PWA / App Chrome -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <header class="mb-8 text-center relative">
            <h1 class="text-3xl font-bold mb-2">📺 IPTV</h1>
            <p class="text-gray-400">Visualizza e riproduci i canali dal tuo file IPTV.m3u su GitHub</p>
            <!-- Pulsante Aggiorna in alto -->
            <button onclick="location.reload()" class="absolute top-0 right-0 bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded text-sm flex items-center gap-1 transition">
                🔄 Aggiorna
            </button>
        </header>

        <!-- Barra di ricerca, Filtro Gruppi e Toggle Vista -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-center">
            <input type="text" id="searchInput" placeholder="Cerca canale..." class="w-full md:w-1/3 px-4 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500">
            
            <select id="groupSelect" class="w-full md:w-1/3 px-4 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500">
                <option value="">Tutte le categorie (Gruppi)</option>
            </select>

            <!-- Pulsanti Cambio Vista -->
            <div class="flex gap-2 w-full md:w-auto justify-center">
                <button id="btnGrid" onclick="setViewMode('grid')" class="px-4 py-2 rounded bg-gray-800 text-gray-400 font-medium text-sm transition">Griglia</button>
                <button id="btnList" onclick="setViewMode('list')" class="px-4 py-2 rounded bg-gray-800 text-gray-400 font-medium text-sm transition">Elenco</button>
            </div>
        </div>

        <!-- Contenitore Canali -->
        <div id="channelsContainer">
            <p class="text-gray-400 text-center">Caricamento canali e guida TV in corso...</p>
        </div>
    </div>

    <!-- Modale Player a Tutto Schermo con Swipe e Tendina Laterale Canali -->
    <div id="fullscreenModal" class="fixed inset-0 bg-black bg-opacity-95 z-50 hidden flex flex-col justify-center items-center p-2 md:p-4">
        <div class="w-full max-w-6xl flex justify-between items-center mb-2">
            <div class="flex items-center gap-3">
                <h2 id="fullscreenTitle" class="text-lg md:text-xl font-bold text-blue-400"></h2>
                <button onclick="toggleChannelDrawer()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded transition flex items-center gap-1">
                    📋 Lista Canali
                </button>
            </div>
            <button onclick="closeFullscreenPlayer()" class="bg-red-600 hover:bg-red-500 text-white font-bold px-3 py-1.5 rounded text-xs md:text-sm transition">Chiudi ✕</button>
        </div>
        <p class="text-[11px] text-gray-400 mb-2 text-center">💡 Swipe in alto/basso per cambiare canale | Swipe a sinistra per aprire la lista</p>
        
        <!-- Area Principale Player + Drawer laterale -->
        <div class="w-full max-w-6xl relative flex flex-grow bg-black rounded-lg overflow-hidden shadow-2xl items-center justify-center">
            
            <!-- Area Video / Swipe -->
            <div id="swipeArea" class="w-full h-full flex justify-center items-center flex-grow">
                <video id="fullscreenVideoPlayer" controls autoplay class="w-full max-h-[75vh] bg-black"></video>
            </div>

            <!-- Tendina Laterale Lista Canali -->
            <div id="channelDrawer" class="absolute top-0 right-0 h-full w-80 max-w-full bg-gray-900 bg-opacity-95 border-l border-gray-700 transform translate-x-full transition-transform duration-300 z-20 flex flex-col shadow-2xl">
                <div class="p-3 border-b border-gray-700 flex justify-between items-center bg-gray-800">
                    <h3 class="font-bold text-sm text-blue-400">Canali Disponibili</h3>
                    <button onclick="toggleChannelDrawer()" class="text-gray-400 hover:text-white text-sm px-2">✕</button>
                </div>
                <div class="p-2 border-b border-gray-800">
                    <input type="text" id="drawerSearch" placeholder="Filtra nella lista..." class="w-full px-3 py-1.5 text-xs rounded bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500 text-white">
                </div>
                <div id="drawerListContainer" class="flex-grow overflow-y-auto divide-y divide-gray-800 text-sm">
                    <!-- Inserito dinamicamente -->
                </div>
            </div>

        </div>
    </div>

    <script>
        const m3uUrl = 'https://cavannastefano-sudo.github.io/lista.m3u/IPTV.m3u'; 
        const epgUrl = 'http://rebrand.ly/epgitalia';
        
        let channels = [];
        let epgData = {}; // Memorizza i programmi EPG per tvg-id o nome
        let filteredChannelsCache = []; 
        let currentFullscreenIndex = 0; 
        
        let currentView = localStorage.getItem('iptv_view_mode') || 'grid';
        let savedGroup = localStorage.getItem('iptv_selected_group') || '';

        async function initApp() {
            await loadEpg();
            await loadPlaylist();
        }

        async function loadEpg() {
            try {
                // Utilizziamo un proxy CORS pubblico per leggere il file XML esterno dal browser
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(epgUrl);
                const response = await fetch(proxyUrl);
                if (!response.ok) return;
                const xmlText = await response.text();
                
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                const programmes = xmlDoc.getElementsByTagName("programme");
                
                const now = new Date();

                for (let prog of programmes) {
                    const channelId = prog.getAttribute("channel");
                    const startStr = prog.getAttribute("start"); // Formato YYYYMMDDHHMMSS +ZZZZ
                    const stopStr = prog.getAttribute("stop");
                    const titleElem = prog.getElementsByTagName("title")[0];
                    
                    if (channelId && titleElem && startStr && stopStr) {
                        const startDate = parseEpgDate(startStr);
                        const stopDate = parseEpgDate(stopStr);

                        if (now >= startDate && now <= stopDate) {
                            if (!epgData[channelId]) {
                                epgData[channelId] = [];
                            }
                            epgData[channelId].push(titleElem.textContent);
                        }
                    }
                }
            } catch (e) {
                console.warn("Impossibile caricare la guida TV EPG:", e);
            }
        }

        function parseEpgDate(str) {
            const year = parseInt(str.substr(0, 4), 10);
            const month = parseInt(str.substr(4, 2), 10) - 1;
            const day = parseInt(str.substr(6, 2), 10);
            const hour = parseInt(str.substr(8, 2), 10);
            const minute = parseInt(str.substr(10, 2), 10);
            const second = parseInt(str.substr(12, 2), 10);
            return new Date(Date.UTC(year, month, day, hour - 1, minute, second)); // Conversione orario
        }

        async function loadPlaylist() {
            try {
                const response = await fetch(m3uUrl);
                if (!response.ok) {
                    throw new Error(`File non trovato o errore HTTP (${response.status})`);
                }
                const data = await response.text();
                parseM3U(data);
                
                if (channels.length === 0) {
                    document.getElementById('channelsContainer').innerHTML = '<p class="text-yellow-500 text-center">File letto, ma nessun canale trovato.</p>';
                    return;
                }

                populateGroups();
                updateViewButtons();
                filterChannels();
            } catch (error) {
                console.error('Errore:', error);
                document.getElementById('channelsContainer').innerHTML = `<p class="text-red-500 text-center">Errore: ${error.message}. Assicurati che <b>IPTV.m3u</b> sia caricato correttamente.</p>`;
            }
        }

        function parseM3U(data) {
            const lines = data.split(/\r?\n/);
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    
                    let logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    currentChannel.logo = logoMatch ? logoMatch[1] : '';

                    let groupMatch = line.match(/group-title="([^"]*)"/);
                    currentChannel.group = groupMatch ? groupMatch[1] : 'Altro';

                    let idMatch = line.match(/tvg-id="([^"]*)"/);
                    currentChannel.tvgId = idMatch ? idMatch[1] : '';

                    let nameParts = line.split(',');
                    currentChannel.name = nameParts[nameParts.length - 1].trim();
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if (currentChannel.name && currentChannel.url) {
                        // Cerca programma in onda tramite tvg-id o nome canale
                        let currentShow = "In onda ora non disponibile";
                        if (currentChannel.tvgId && epgData[currentChannel.tvgId]) {
                            currentShow = epgData[currentChannel.tvgId][0];
                        } else if (epgData[currentChannel.name]) {
                            currentShow = epgData[currentChannel.name][0];
                        }
                        currentChannel.nowPlaying = currentShow;
                        
                        channels.push(currentChannel);
                    }
                }
            }
        }

        function populateGroups() {
            const groups = [...new Set(channels.map(c => c.group))].sort();
            const select = document.getElementById('groupSelect');
            
            groups.forEach(group => {
                const option = document.createElement('option');
                option.value = group;
                option.textContent = group;
                select.appendChild(option);
            });

            if (savedGroup) {
                select.value = savedGroup;
            }
        }

        function setViewMode(mode) {
            stopAllPlayers();
            currentView = mode;
            localStorage.setItem('iptv_view_mode', mode);
            updateViewButtons();
            filterChannels();
        }

        function updateViewButtons() {
            const btnGrid = document.getElementById('btnGrid');
            const btnList = document.getElementById('btnList');

            if (currentView === 'grid') {
                btnGrid.className = 'px-4 py-2 rounded bg-blue-600 text-white font-medium text-sm transition';
                btnList.className = 'px-4 py-2 rounded bg-gray-800 text-gray-400 font-medium text-sm hover:bg-gray-700 transition';
            } else {
                btnList.className = 'px-4 py-2 rounded bg-blue-600 text-white font-medium text-sm transition';
                btnGrid.className = 'px-4 py-2 rounded bg-gray-800 text-gray-400 font-medium text-sm hover:bg-gray-700 transition';
            }
        }

        function stopAllPlayers() {
            document.querySelectorAll('video').forEach(video => {
                video.pause();
                video.src = '';
            });

            if (window.hlsInstances) {
                Object.keys(window.hlsInstances).forEach(key => {
                    if (window.hlsInstances[key]) {
                        window.hlsInstances[key].destroy();
                        delete window.hlsInstances[key];
                    }
                });
            } else {
                window.hlsInstances = {};
            }

            document.querySelectorAll('[id^="inline-player-"]').forEach(el => {
                el.classList.add('hidden');
                el.innerHTML = '';
            });
            document.querySelectorAll('[id^="inline-row-"]').forEach(el => {
                el.classList.add('hidden');
            });
        }

        function renderChannels(channelsToRender) {
            const container = document.getElementById('channelsContainer');
            container.innerHTML = '';

            if (channelsToRender.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center">Nessun canale corrisponde ai criteri.</p>';
                return;
            }

            if (currentView === 'grid') {
                const gridDiv = document.createElement('div');
                gridDiv.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4';

                channelsToRender.forEach((channel, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'flex flex-col col-span-1';

                    const card = document.createElement('div');
                    card.className = 'bg-gray-800 rounded-lg p-4 flex items-center justify-between shadow hover:bg-gray-700 transition cursor-pointer';
                    
                    card.innerHTML = `
                        <div class="flex items-center space-x-3 overflow-hidden flex-grow" onclick="toggleInlinePlayer(${index}, '${channel.url}', '${channel.name.replace(/'/g, "\\'")}')">
                            <img src="${channel.logo}" alt="" class="w-10 h-10 object-contain bg-transparent rounded p-1 flex-shrink-0" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                            <div class="truncate">
                                <h4 class="font-medium text-sm truncate">${channel.name}</h4>
                                <p class="text-[11px] text-blue-400 truncate">▶ ${channel.nowPlaying}</p>
                                <span class="text-xs text-gray-400">${channel.group}</span>
                            </div>
                        </div>
                        <button onclick="playFullscreenByIndex(${index})" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1.5 rounded flex-shrink-0 ml-2">Riproduci</button>
                    `;
                    wrapper.appendChild(card);

                    const inlinePlayerDiv = document.createElement('div');
                    inlinePlayerDiv.id = `inline-player-${index}`;
                    inlinePlayerDiv.className = 'hidden mt-2 bg-black p-3 rounded-lg shadow-lg relative col-span-full';
                    wrapper.appendChild(inlinePlayerDiv);

                    gridDiv.appendChild(wrapper);
                });
                container.appendChild(gridDiv);

            } else {
                const tableWrapper = document.createElement('div');
                tableWrapper.className = 'bg-gray-800 rounded-lg shadow overflow-hidden';
                
                const table = document.createElement('table');
                table.className = 'w-full text-left border-collapse';
                table.innerHTML = `
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-xs uppercase">
                            <th class="p-3 w-16 text-center">Logo</th>
                            <th class="p-3">Nome Canale / In Onda Ora</th>
                            <th class="p-3">Categoria</th>
                            <th class="p-3 text-right">Azione</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-700 text-sm"></tbody>
                `;
                tableWrapper.appendChild(table);
                container.appendChild(tableWrapper);

                const tbody = document.getElementById('tableBody');
                channelsToRender.forEach((channel, index) => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-750 transition';
                    tr.innerHTML = `
                        <td class="p-3 text-center cursor-pointer" onclick="toggleInlinePlayer(${index}, '${channel.url}', '${channel.name.replace(/'/g, "\\'")}')">
                            <img src="${channel.logo}" alt="" class="w-8 h-8 object-contain bg-transparent rounded p-0.5 mx-auto" onerror="this.src='https://via.placeholder.com/32?text=TV'">
                        </td>
                        <td class="p-3 font-medium cursor-pointer" onclick="toggleInlinePlayer(${index}, '${channel.url}', '${channel.name.replace(/'/g, "\\'")}')">
                            <div class="truncate max-w-xs">${channel.name}</div>
                            <div class="text-xs text-blue-400 truncate max-w-xs">▶ ${channel.nowPlaying}</div>
                        </td>
                        <td class="p-3 text-gray-400 text-xs cursor-pointer" onclick="toggleInlinePlayer(${index}, '${channel.url}', '${channel.name.replace(/'/g, "\\'")}')">${channel.group}</td>
                        <td class="p-3 text-right">
                            <button onclick="playFullscreenByIndex(${index})" class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1 rounded">Riproduci</button>
                        </td>
                    `;
                    tbody.appendChild(tr);

                    const trPlayer = document.createElement('tr');
                    trPlayer.id = `inline-row-${index}`;
                    trPlayer.className = 'hidden bg-black';
                    trPlayer.innerHTML = `
                        <td colspan="4" class="p-4">
                            <div class="flex justify-between items-center mb-2">
                                <h3 id="inline-title-${index}" class="text-sm font-semibold text-blue-400"></h3>
                                <button onclick="closeInlinePlayer(${index})" class="text-gray-400 hover:text-white px-2 py-0.5 bg-gray-800 rounded text-xs">Chiudi ✕</button>
                            </div>
                            <video id="inline-video-${index}" controls autoplay class="w-full max-h-72 rounded bg-black"></video>
                        </td>
                    `;
                    tbody.appendChild(trPlayer);
                });
            }
        }

        function toggleInlinePlayer(index, url, name) {
            stopAllPlayers();

            if (currentView === 'grid') {
                const playerDiv = document.getElementById(`inline-player-${index}`);
                playerDiv.classList.remove('hidden');
                playerDiv.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-sm font-semibold text-blue-400">${name}</h3>
                        <button onclick="closeInlinePlayer(${index})" class="text-gray-400 hover:text-white px-2 py-0.5 bg-gray-800 rounded text-xs">Chiudi ✕</button>
                    </div>
                    <video id="inline-video-${index}" controls autoplay class="w-full max-h-72 rounded bg-black"></video>
                `;

                const video = document.getElementById(`inline-video-${index}`);
                loadVideoSource(video, url, false, index);

            } else {
                const rowPlayer = document.getElementById(`inline-row-${index}`);
                const title = document.getElementById(`inline-title-${index}`);
                const video = document.getElementById(`inline-video-${index}`);

                title.textContent = name;
                rowPlayer.classList.remove('hidden');
                loadVideoSource(video, url, false, index);
            }
        }

        function closeInlinePlayer(index) {
            stopAllPlayers();
        }

        function playFullscreenByIndex(index) {
            stopAllPlayers();
            
            currentFullscreenIndex = index;
            const channel = filteredChannelsCache[currentFullscreenIndex];
            if (!channel) return;

            const modal = document.getElementById('fullscreenModal');
            const video = document.getElementById('fullscreenVideoPlayer');
            const title = document.getElementById('fullscreenTitle');

            title.textContent = `(${currentFullscreenIndex + 1}/${filteredChannelsCache.length}) ${channel.name} - ${channel.nowPlaying}`;
            modal.classList.remove('hidden');

            loadVideoSource(video, channel.url, true);
            renderDrawerList();
        }

        function closeFullscreenPlayer() {
            stopAllPlayers();
            document.getElementById('fullscreenModal').classList.add('hidden');
            document.getElementById('channelDrawer').classList.add('translate-x-full');
        }

        function toggleChannelDrawer() {
            const drawer = document.getElementById('channelDrawer');
            drawer.classList.toggle('translate-x-full');
        }

        function renderDrawerList(filterText = '') {
            const container = document.getElementById('drawerListContainer');
            container.innerHTML = '';

            filteredChannelsCache.forEach((channel, index) => {
                if (filterText && !channel.name.toLowerCase().includes(filterText.toLowerCase())) {
                    return;
                }

                const item = document.createElement('div');
                item.className = `p-2.5 flex items-center gap-2 hover:bg-gray-800 cursor-pointer transition ${index === currentFullscreenIndex ? 'bg-blue-900 bg-opacity-40 border-l-4 border-blue-500' : ''}`;
                item.innerHTML = `
                    <img src="${channel.logo}" alt="" class="w-7 h-7 object-contain bg-transparent rounded p-0.5 flex-shrink-0" onerror="this.src='https://via.placeholder.com/28?text=TV'">
                    <div class="truncate flex-grow">
                        <div class="font-medium text-xs truncate ${index === currentFullscreenIndex ? 'text-blue-400 font-bold' : ''}">${channel.name}</div>
                        <div class="text-[10px] text-gray-400 truncate">${channel.nowPlaying}</div>
                    </div>
                `;
                item.addEventListener('click', () => {
                    playFullscreenByIndex(index);
                    toggleChannelDrawer();
                });
                container.appendChild(item);
            });
        }

        document.getElementById('drawerSearch').addEventListener('input', function() {
            renderDrawerList(this.value);
        });

        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        const swipeArea = document.getElementById('swipeArea');

        swipeArea.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        swipeArea.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const xDiff = touchStartX - touchEndX;
            const yDiff = touchStartY - touchEndY;
            const threshold = 50;

            if (Math.abs(xDiff) > Math.abs(yDiff)) {
                if (xDiff > threshold) {
                    const drawer = document.getElementById('channelDrawer');
                    drawer.classList.remove('translate-x-full');
                } else if (xDiff < -threshold) {
                    const drawer = document.getElementById('channelDrawer');
                    drawer.classList.add('translate-x-full');
                }
            } else {
                if (yDiff > threshold) {
                    changeFullscreenChannel(1);
                } else if (yDiff < -threshold) {
                    changeFullscreenChannel(-1);
                }
            }
        }

        function changeFullscreenChannel(direction) {
            if (filteredChannelsCache.length === 0) return;
            currentFullscreenIndex += direction;

            if (currentFullscreenIndex < 0) {
                currentFullscreenIndex = filteredChannelsCache.length - 1;
            } else if (currentFullscreenIndex >= filteredChannelsCache.length) {
                currentFullscreenIndex = 0;
            }

            playFullscreenByIndex(currentFullscreenIndex);
        }

        function loadVideoSource(videoElement, url, isFullscreen = false, index = 'fs') {
            if (!window.hlsInstances) window.hlsInstances = {};

            if (Hls.isSupported() && url.includes('.m3u8')) {
                if (window.hlsInstances[index]) {
                    window.hlsInstances[index].destroy();
                }
                const hls = new Hls();
                window.hlsInstances[index] = hls;
                hls.loadSource(url);
                hls.attachMedia(videoElement);
                hls.on(Hls.Events.MANIFEST_PARSED, () => videoElement.play());
            } else {
                videoElement.src = url;
                videoElement.play();
            }
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            stopAllPlayers();
            filterChannels();
        });
        
        document.getElementById('groupSelect').addEventListener('change', function() {
            stopAllPlayers();
            localStorage.setItem('iptv_selected_group', this.value);
            filterChannels();
        });

        function filterChannels() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const group = document.getElementById('groupSelect').value;

            filteredChannelsCache = channels.filter(channel => {
                const matchesSearch = channel.name.toLowerCase().includes(search);
                const matchesGroup = group === '' || channel.group === group;
                return matchesSearch && matchesGroup;
            });

            renderChannels(filteredChannelsCache);
        }

        // Avvio dell'applicazione
        initApp();
    </script>
</body>
</html>
