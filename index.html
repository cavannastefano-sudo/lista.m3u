<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Web Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <div class="container mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold mb-2">📺 La mia Lista IPTV</h1>
            <p class="text-gray-400">Visualizza e riproduci i canali dal tuo file IPTV.m3u su GitHub</p>
        </header>

        <!-- Barra di ricerca, Filtro Gruppi e Toggle Vista -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-center">
            <input type="text" id="searchInput" placeholder="Cerca canale..." class="w-full md:w-1/3 px-4 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500">
            
            <select id="groupSelect" class="w-full md:w-1/3 px-4 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500">
                <option value="">Tutte le categorie (Gruppi)</option>
            </select>

            <!-- Pulsanti Cambio Vista -->
            <div class="flex gap-2 w-full md:w-auto justify-center">
                <button id="btnGrid" onclick="setViewMode('grid')" class="px-4 py-2 rounded bg-gray-800 text-gray-400 font-medium text-sm transition">Griglia</button>
                <button id="btnList" onclick="setViewMode('list')" class="px-4 py-2 rounded bg-gray-800 text-gray-400 font-medium text-sm transition">Elenco</button>
            </div>
        </div>

        <!-- Sezione Player Video -->
        <div id="playerContainer" class="hidden mb-8 bg-black p-4 rounded-lg shadow-lg relative">
            <div class="flex justify-between items-center mb-2">
                <h3 id="currentChannelTitle" class="text-lg font-semibold text-blue-400"></h3>
                <button onclick="closePlayer()" class="text-gray-400 hover:text-white px-2 py-1 bg-gray-800 rounded">Chiudi ✕</button>
            </div>
            <video id="videoPlayer" controls autoplay class="w-full max-h-96 rounded bg-black"></video>
        </div>

        <!-- Contenitore Canali -->
        <div id="channelsContainer">
            <p class="text-gray-400 text-center">Caricamento canali in corso...</p>
        </div>
    </div>

    <script>
        const m3uUrl = 'IPTV.m3u'; 
        let channels = [];
        
        // Legge la vista salvata in precedenza, altrimenti imposta 'grid' come predefinita
        let currentView = localStorage.getItem('iptv_view_mode') || 'grid';

        async function loadPlaylist() {
            try {
                const response = await fetch(m3uUrl);
                if (!response.ok) {
                    throw new Error(`File non trovato o errore HTTP (${response.status})`);
                }
                const data = await response.text();
                parseM3U(data);
                
                if (channels.length === 0) {
                    document.getElementById('channelsContainer').innerHTML = '<p class="text-yellow-500 text-center">File letto, ma nessun canale trovato.</p>';
                    return;
                }

                populateGroups();
                updateViewButtons();
                filterChannels();
            } catch (error) {
                console.error('Errore:', error);
                document.getElementById('channelsContainer').innerHTML = `<p class="text-red-500 text-center">Errore: ${error.message}. Assicurati che <b>IPTV.m3u</b> sia nella stessa cartella di index.html.</p>`;
            }
        }

        function parseM3U(data) {
            const lines = data.split(/\r?\n/);
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    
                    let logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    currentChannel.logo = logoMatch ? logoMatch[1] : '';

                    let groupMatch = line.match(/group-title="([^"]*)"/);
                    currentChannel.group = groupMatch ? groupMatch[1] : 'Altro';

                    let nameParts = line.split(',');
                    currentChannel.name = nameParts[nameParts.length - 1].trim();
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if (currentChannel.name && currentChannel.url) {
                        channels.push(currentChannel);
                    }
                }
            }
        }

        function populateGroups() {
            const groups = [...new Set(channels.map(c => c.group))].sort();
            const select = document.getElementById('groupSelect');
            groups.forEach(group => {
                const option = document.createElement('option');
                option.value = group;
                option.textContent = group;
                select.appendChild(option);
            });
        }

        function setViewMode(mode) {
            currentView = mode;
            // Salva la scelta nella memoria del browser
            localStorage.setItem('iptv_view_mode', mode);
            updateViewButtons();
            filterChannels();
        }

        function updateViewButtons() {
            const btnGrid = document.getElementById('btnGrid');
            const btnList = document.getElementById('btnList');

            if (currentView === 'grid') {
                btnGrid.className = 'px-4 py-2 rounded bg-blue-600 text-white font-medium text-sm transition';
                btnList.className = 'px-4 py-2 rounded bg-gray-800 text-gray-400 font-medium text-sm hover:bg-gray-700 transition';
            } else {
                btnList.className = 'px-4 py-2 rounded bg-blue-600 text-white font-medium text-sm transition';
                btnGrid.className = 'px-4 py-2 rounded bg-gray-800 text-gray-400 font-medium text-sm hover:bg-gray-700 transition';
            }
        }

        function renderChannels(channelsToRender) {
            const container = document.getElementById('channelsContainer');
            container.innerHTML = '';

            if (channelsToRender.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center">Nessun canale corrisponde alla ricerca.</p>';
                return;
            }

            if (currentView === 'grid') {
                const gridDiv = document.createElement('div');
                gridDiv.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4';

                channelsToRender.forEach(channel => {
                    const card = document.createElement('div');
                    card.className = 'bg-gray-800 rounded-lg p-4 flex items-center justify-between shadow hover:bg-gray-700 transition cursor-pointer';
                    card.innerHTML = `
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <img src="${channel.logo}" alt="" class="w-10 h-10 object-contain bg-white rounded p-1 flex-shrink-0" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                            <div class="truncate">
                                <h4 class="font-medium text-sm truncate">${channel.name}</h4>
                                <span class="text-xs text-gray-400">${channel.group}</span>
                            </div>
                        </div>
                        <button class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1.5 rounded flex-shrink-0 ml-2">Riproduci</button>
                    `;
                    card.addEventListener('click', () => playStream(channel.url, channel.name));
                    gridDiv.appendChild(card);
                });
                container.appendChild(gridDiv);

            } else {
                const tableWrapper = document.createElement('div');
                tableWrapper.className = 'overflow-x-auto bg-gray-800 rounded-lg shadow';
                
                let tableHTML = `
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-700 text-gray-400 text-xs uppercase">
                                <th class="p-3 w-16 text-center">Logo</th>
                                <th class="p-3">Nome Canale</th>
                                <th class="p-3">Categoria</th>
                                <th class="p-3 text-right">Azione</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-700 text-sm">
                `;

                channelsToRender.forEach(channel => {
                    tableHTML += `
                        <tr class="hover:bg-gray-750 transition cursor-pointer" onclick="playStream('${channel.url}', '${channel.name.replace(/'/g, "\\'")}')">
                            <td class="p-3 text-center">
                                <img src="${channel.logo}" alt="" class="w-8 h-8 object-contain bg-white rounded p-0.5 mx-auto" onerror="this.src='https://via.placeholder.com/32?text=TV'">
                            </td>
                            <td class="p-3 font-medium truncate max-w-xs">${channel.name}</td>
                            <td class="p-3 text-gray-400 text-xs">${channel.group}</td>
                            <td class="p-3 text-right">
                                <button class="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1 rounded">Riproduci</button>
                            </td>
                        </tr>
                    `;
                });

                tableHTML += `</tbody></table>`;
                tableWrapper.innerHTML = tableHTML;
                container.appendChild(tableWrapper);
            }
        }

        function playStream(url, name) {
            const playerContainer = document.getElementById('playerContainer');
            const video = document.getElementById('videoPlayer');
            const title = document.getElementById('currentChannelTitle');

            title.textContent = name;
            playerContainer.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (Hls.isSupported() && url.includes('.m3u8')) {
                if (window.hls) {
                    window.hls.destroy();
                }
                const hls = new Hls();
                window.hls = hls;
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else {
                video.src = url;
                video.play();
            }
        }

        function closePlayer() {
            const video = document.getElementById('videoPlayer');
            video.pause();
            video.src = '';
            if (window.hls) {
                window.hls.destroy();
            }
            document.getElementById('playerContainer').classList.add('hidden');
        }

        document.getElementById('searchInput').addEventListener('input', filterChannels);
        document.getElementById('groupSelect').addEventListener('change', filterChannels);

        function filterChannels() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const group = document.getElementById('groupSelect').value;

            const filtered = channels.filter(channel => {
                const matchesSearch = channel.name.toLowerCase().includes(search);
                const matchesGroup = group === '' || channel.group === group;
                return matchesSearch && matchesGroup;
            });

            renderChannels(filtered);
        }

        loadPlaylist();
    </script>
</body>
</html>
