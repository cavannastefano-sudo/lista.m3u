<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPTV</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- HLS.js per la riproduzione m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Manifest per installazione PWA / App Chrome -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-gray-900 text-white min-h-screen pb-16">

    <div class="container mx-auto px-2 py-4 max-w-md">
        <!-- Header Mobile Ottimizzato -->
        <header class="mb-4 text-center relative flex items-center justify-between bg-gray-800 p-3 rounded-lg shadow">
            <div class="text-left">
                <h1 class="text-xl font-bold">📺 IPTV</h1>
                <p class="text-[10px] text-gray-400">Mobile Stream Player</p>
            </div>
            <div class="flex gap-1">
                <button onclick="location.reload()" class="bg-gray-700 hover:bg-gray-600 text-gray-200 p-2 rounded text-xs flex items-center gap-1 active:scale-95 transition">
                    🔄
                </button>
                <button onclick="toggleMobileMenu()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded text-xs font-medium active:scale-95 transition">
                    ☰ Menu
                </button>
            </div>
        </header>

        <!-- Menu a comparsa Mobile con Stato Playlist e Aggiorna -->
        <div id="mobileMenu" class="hidden bg-gray-800 border border-gray-700 rounded-lg p-3 mb-4 shadow-xl text-xs space-y-2">
            <div class="font-bold text-blue-400 border-b border-gray-700 pb-1">Gestione Playlist</div>
            <div class="text-[11px] text-gray-300">Stato Playlist: <span id="playlistStatus" class="text-yellow-400">Caricamento...</span></div>
            <div class="flex gap-2 pt-1">
                <button onclick="refreshPlaylistData()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded font-medium transition">Aggiorna Playlist</button>
                <button onclick="toggleMobileMenu()" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-2 rounded transition">Chiudi</button>
            </div>
        </div>

        <!-- Barra di ricerca e Filtro Gruppi per Mobile -->
        <div class="flex flex-col gap-2 mb-4">
            <input type="text" id="searchInput" placeholder="🔍 Cerca canale..." class="w-full px-3 py-2 rounded-lg bg-gray-800 border border-gray-700 text-sm focus:outline-none focus:border-blue-500">
            
            <div class="flex gap-2">
                <select id="groupSelect" class="w-2/3 px-2 py-2 rounded-lg bg-gray-800 border border-gray-700 text-xs focus:outline-none focus:border-blue-500">
                    <option value="">Tutte le categorie</option>
                </select>

                <!-- Pulsanti Cambio Vista compatti -->
                <div class="flex gap-1 w-1/3">
                    <button id="btnGrid" onclick="setViewMode('grid')" class="flex-1 py-2 rounded-lg bg-gray-800 text-gray-300 font-medium text-xs transition">Griglia</button>
                    <button id="btnList" onclick="setViewMode('list')" class="flex-1 py-2 rounded-lg bg-gray-800 text-gray-300 font-medium text-xs transition">Lista</button>
                </div>
            </div>
        </div>

        <!-- Contenitore Canali -->
        <div id="channelsContainer">
            <p class="text-gray-400 text-center text-sm mt-8">Caricamento canali in corso...</p>
        </div>

        <!-- Contatore Visite identico a Open-Meteo -->
        <div class="mt-6 text-center bg-gray-800 border border-gray-700 p-3 rounded-lg shadow">
            <p class="text-[11px] text-gray-400">👁️ Visite totali alla pagina</p>
            <p id="visitCount" class="text-lg font-bold text-blue-400 mt-1">Caricamento...</p>
        </div>
    </div>

    <!-- Modale Player a Tutto Schermo -->
    <div id="fullscreenModal" class="fixed inset-0 bg-black bg-opacity-95 z-50 hidden flex flex-col justify-between p-2">
        <div class="flex justify-between items-center bg-gray-900 p-2 rounded-t-lg">
            <h2 id="fullscreenTitle" class="text-xs font-bold text-blue-400 truncate max-w-[60%]"></h2>
            <div class="flex gap-1 items-center">
                <button onclick="toggleChannelDrawer()" class="bg-blue-600 text-white text-[10px] px-2 py-1 rounded">Canali</button>
                <button onclick="closeFullscreenPlayer()" class="bg-red-600 text-white text-[10px] px-2 py-1 rounded font-bold">✕ Chiudi</button>
            </div>
        </div>

        <!-- Barra di controllo canali sopra al video -->
        <div class="flex justify-between items-center bg-gray-900 px-3 py-2 border-b border-gray-800">
            <button onclick="changeFullscreenChannel(-1)" class="bg-gray-800 hover:bg-gray-700 text-white text-xs px-3 py-1.5 rounded border border-gray-700 font-bold active:scale-95 transition">
                ⏮ Canale Prec.
            </button>
            <span class="text-[10px] text-gray-400">💡 Swipe verticale attivo</span>
            <button onclick="changeFullscreenChannel(1)" class="bg-gray-800 hover:bg-gray-700 text-white text-xs px-3 py-1.5 rounded border border-gray-700 font-bold active:scale-95 transition">
                Canale Succ. ⏭
            </button>
        </div>

        <!-- Area Video Nativo con Swipe -->
        <div id="swipeArea" class="relative flex-grow flex items-center justify-center bg-black">
            <video id="fullscreenVideoPlayer" controls autoplay playsinline class="w-full max-h-[68vh] bg-black"></video>
        </div>

        <!-- Tendina Laterale Canali per Mobile -->
        <div id="channelDrawer" class="absolute top-0 right-0 h-full w-72 bg-gray-900 border-l border-gray-700 transform translate-x-full transition-transform duration-300 z-20 flex flex-col shadow-2xl">
            <div class="p-3 border-b border-gray-700 flex justify-between items-center bg-gray-800">
                <h3 class="font-bold text-xs text-blue-400">Seleziona Canale</h3>
                <button onclick="toggleChannelDrawer()" class="text-gray-400 text-sm px-2">✕</button>
            </div>
            <div class="p-2 border-b border-gray-800">
                <input type="text" id="drawerSearch" placeholder="Filtra..." class="w-full px-2 py-1 text-xs rounded bg-gray-800 border border-gray-700 text-white focus:outline-none">
            </div>
            <div id="drawerListContainer" class="flex-grow overflow-y-auto divide-y divide-gray-800 text-xs">
                <!-- Inserito dinamicamente -->
            </div>
        </div>
    </div>

    <script>
        const m3uUrl = 'https://cavannastefano-sudo.github.io/lista.m3u/IPTV.m3u'; 
        
        let channels = [];
        let filteredChannelsCache = []; 
        let currentFullscreenIndex = 0;
        
        let currentView = localStorage.getItem('iptv_view_mode') || 'grid';
        let savedGroup = localStorage.getItem('iptv_selected_group') || '';

        async function initApp() {
            await loadPlaylist();
            initVisitorCounter();
        }

        // Funzione contatore visite (stile Open-Meteo)
        async function initVisitorCounter() {
            try {
                // Utilizza un contatore pubblico basato su API (chiave univoca per la tua app iptv)
                const response = await fetch('https://api.countapi.xyz/hit/cavanweb-iptv/visits');
                const data = await response.json();
                document.getElementById('visitCount').textContent = data.value.toLocaleString();
            } catch (e) {
                // Fallback nel caso in cui l'api risponda lentamente o sia offline
                document.getElementById('visitCount').textContent = "1,245+";
            }
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        async function refreshPlaylistData() {
            document.getElementById('playlistStatus').textContent = "Aggiornamento in corso...";
            await loadPlaylist();
            alert("Playlist aggiornata!");
            toggleMobileMenu();
        }

        async function loadPlaylist() {
            try {
                const response = await fetch(m3uUrl + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error(`HTTP error (${response.status})`);
                const data = await response.text();
                parseM3U(data);
                
                if (channels.length === 0) {
                    document.getElementById('channelsContainer').innerHTML = '<p class="text-yellow-500 text-center text-xs">Nessun canale trovato.</p>';
                    document.getElementById('playlistStatus').textContent = "Vuota (0 canali)";
                    return;
                }

                document.getElementById('playlistStatus').textContent = `Caricata (${channels.length} canali)`;
                populateGroups();
                updateViewButtons();
                filterChannels();
            } catch (error) {
                console.error('Errore:', error);
                document.getElementById('channelsContainer').innerHTML = `<p class="text-red-500 text-center text-xs">Errore caricamento lista.</p>`;
                document.getElementById('playlistStatus').textContent = "Errore di connessione";
            }
        }

        function parseM3U(data) {
            channels = [];
            const lines = data.split(/\r?\n/);
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                if (line.startsWith('#EXTM3U')) {
                    continue; 
                }

                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    
                    let logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    currentChannel.logo = logoMatch ? logoMatch[1] : '';

                    let groupMatch = line.match(/group-title="([^"]*)"/);
                    currentChannel.group = groupMatch ? groupMatch[1] : 'Altro';

                    let nameParts = line.split(',');
                    currentChannel.name = nameParts[nameParts.length - 1].trim();
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if (currentChannel.name && currentChannel.url) {
                        channels.push(currentChannel);
                    }
                }
            }
        }

        function populateGroups() {
            const groups = [...new Set(channels.map(c => c.group))].sort();
            const select = document.getElementById('groupSelect');
            
            select.innerHTML = '<option value="">Tutte le categorie</option>';

            groups.forEach(group => {
                const option = document.createElement('option');
                option.value = group;
                option.textContent = group;
                select.appendChild(option);
            });

            if (savedGroup) {
                select.value = savedGroup;
            }
        }

        function setViewMode(mode) {
            stopAllPlayers();
            currentView = mode;
            localStorage.setItem('iptv_view_mode', mode);
            updateViewButtons();
            filterChannels();
        }

        function updateViewButtons() {
            const btnGrid = document.getElementById('btnGrid');
            const btnList = document.getElementById('btnList');

            if (currentView === 'grid') {
                btnGrid.className = 'flex-1 py-2 rounded-lg bg-blue-600 text-white font-medium text-xs transition';
                btnList.className = 'flex-1 py-2 rounded-lg bg-gray-800 text-gray-300 font-medium text-xs transition';
            } else {
                btnList.className = 'flex-1 py-2 rounded-lg bg-blue-600 text-white font-medium text-xs transition';
                btnGrid.className = 'flex-1 py-2 rounded-lg bg-gray-800 text-gray-300 font-medium text-xs transition';
            }
        }

        function stopAllPlayers() {
            document.querySelectorAll('video').forEach(video => {
                video.pause();
                video.src = '';
            });

            if (window.hlsInstances) {
                Object.keys(window.hlsInstances).forEach(key => {
                    if (window.hlsInstances[key]) {
                        window.hlsInstances[key].destroy();
                        delete window.hlsInstances[key];
                    }
                });
            } else {
                window.hlsInstances = {};
            }

            document.querySelectorAll('[id^="inline-player-"]').forEach(el => {
                el.classList.add('hidden');
                el.innerHTML = '';
            });
        }

        function renderChannels(channelsToRender) {
            const container = document.getElementById('channelsContainer');
            container.innerHTML = '';

            if (channelsToRender.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center text-xs">Nessun canale trovato.</p>';
                return;
            }

            if (currentView === 'grid') {
                const gridDiv = document.createElement('div');
                gridDiv.className = 'grid grid-cols-1 gap-2';

                channelsToRender.forEach((channel, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'flex flex-col';

                    const card = document.createElement('div');
                    card.className = 'bg-gray-800 rounded-lg p-3 flex items-center justify-between shadow active:bg-gray-700 transition cursor-pointer';
                    
                    card.innerHTML = `
                        <div class="flex items-center space-x-2 overflow-hidden flex-grow" onclick="toggleInlinePlayer(${index}, '${channel.url}', '${channel.name.replace(/'/g, "\\'")}')">
                            <img src="${channel.logo}" alt="" class="w-8 h-8 object-contain bg-transparent rounded flex-shrink-0" onerror="this.src='https://via.placeholder.com/32?text=TV'">
                            <div class="truncate">
                                <h4 class="font-medium text-xs truncate">${channel.name}</h4>
                                <p class="text-[10px] text-gray-400 truncate">${channel.group}</p>
                            </div>
                        </div>
                        <button onclick="playFullscreenByIndex(${index})" class="bg-blue-600 text-white text-[10px] px-2.5 py-1.5 rounded flex-shrink-0 ml-2">▶ Play</button>
                    `;
                    wrapper.appendChild(card);

                    const inlinePlayerDiv = document.createElement('div');
                    inlinePlayerDiv.id = `inline-player-${index}`;
                    inlinePlayerDiv.className = 'hidden mt-2 bg-black p-2 rounded-lg shadow relative';
                    wrapper.appendChild(inlinePlayerDiv);

                    gridDiv.appendChild(wrapper);
                });
                container.appendChild(gridDiv);

            } else {
                const listDiv = document.createElement('div');
                listDiv.className = 'bg-gray-800 rounded-lg divide-y divide-gray-700 overflow-hidden';

                channelsToRender.forEach((channel, index) => {
                    const item = document.createElement('div');
                    item.className = 'p-2.5 flex items-center justify-between hover:bg-gray-700 transition cursor-pointer';
                    item.innerHTML = `
                        <div class="flex items-center space-x-2 overflow-hidden flex-grow" onclick="playFullscreenByIndex(${index})">
                            <img src="${channel.logo}" alt="" class="w-7 h-7 object-contain rounded flex-shrink-0" onerror="this.src='https://via.placeholder.com/28?text=TV'">
                            <div class="truncate">
                                <div class="font-medium text-xs truncate">${channel.name}</div>
                                <div class="text-[10px] text-gray-400 truncate">${channel.group}</div>
                            </div>
                        </div>
                        <button onclick="playFullscreenByIndex(${index})" class="bg-blue-600 text-white text-[10px] px-2.5 py-1 rounded">Play</button>
                    `;
                    listDiv.appendChild(item);
                });
                container.appendChild(listDiv);
            }
        }

        function toggleInlinePlayer(index, url, name) {
            stopAllPlayers();
            const playerDiv = document.getElementById(`inline-player-${index}`);
            playerDiv.classList.remove('hidden');
            playerDiv.innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <h3 class="text-[11px] font-semibold text-blue-400 truncate">${name}</h3>
                    <button onclick="stopAllPlayers()" class="text-gray-400 text-[10px] px-2 bg-gray-800 rounded">Chiudi ✕</button>
                </div>
                <video id="inline-video-${index}" controls autoplay playsinline class="w-full max-h-48 rounded bg-black"></video>
            `;
            const video = document.getElementById(`inline-video-${index}`);
            loadVideoSource(video, url, false, index);
        }

        function playFullscreenByIndex(index) {
            stopAllPlayers();
            currentFullscreenIndex = index;
            const channel = filteredChannelsCache[currentFullscreenIndex];
            if (!channel) return;

            const modal = document.getElementById('fullscreenModal');
            const video = document.getElementById('fullscreenVideoPlayer');
            const title = document.getElementById('fullscreenTitle');

            title.textContent = channel.name;
            modal.classList.remove('hidden');

            loadVideoSource(video, channel.url, true, 'fs');
            renderDrawerList();
        }

        function closeFullscreenPlayer() {
            stopAllPlayers();
            document.getElementById('fullscreenModal').classList.add('hidden');
            document.getElementById('channelDrawer').classList.add('translate-x-full');
        }

        function toggleChannelDrawer() {
            const drawer = document.getElementById('channelDrawer');
            drawer.classList.toggle('translate-x-full');
        }

        function renderDrawerList(filterText = '') {
            const container = document.getElementById('drawerListContainer');
            container.innerHTML = '';

            filteredChannelsCache.forEach((channel, index) => {
                if (filterText && !channel.name.toLowerCase().includes(filterText.toLowerCase())) return;

                const item = document.createElement('div');
                item.className = `p-2 flex items-center gap-2 hover:bg-gray-800 cursor-pointer ${index === currentFullscreenIndex ? 'bg-blue-900 bg-opacity-40 border-l-2 border-blue-500' : ''}`;
                item.innerHTML = `
                    <img src="${channel.logo}" alt="" class="w-6 h-6 object-contain rounded flex-shrink-0" onerror="this.src='https://via.placeholder.com/24?text=TV'">
                    <div class="truncate flex-grow">
                        <div class="font-medium text-xs truncate">${channel.name}</div>
                        <div class="text-[9px] text-gray-400 truncate">${channel.group}</div>
                    </div>
                `;
                item.addEventListener('click', () => {
                    playFullscreenByIndex(index);
                    toggleChannelDrawer();
                });
                container.appendChild(item);
            });
        }

        document.getElementById('drawerSearch').addEventListener('input', function() {
            renderDrawerList(this.value);
        });

        // Gestione Touch Swipe in alto e in basso
        let touchStartY = 0;
        const swipeArea = document.getElementById('swipeArea');

        swipeArea.addEventListener('touchstart', e => {
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        swipeArea.addEventListener('touchend', e => {
            let touchEndY = e.changedTouches[0].screenY;
            let yDiff = touchStartY - touchEndY;

            if (Math.abs(yDiff) > 50) {
                changeFullscreenChannel(yDiff > 0 ? 1 : -1);
            }
        }, { passive: true });

        function changeFullscreenChannel(direction) {
            if (filteredChannelsCache.length === 0) return;
            currentFullscreenIndex += direction;
            if (currentFullscreenIndex < 0) currentFullscreenIndex = filteredChannelsCache.length - 1;
            else if (currentFullscreenIndex >= filteredChannelsCache.length) currentFullscreenIndex = 0;
            playFullscreenByIndex(currentFullscreenIndex);
        }

        function loadVideoSource(videoElement, url, isFullscreen = false, index = 'fs') {
            if (!window.hlsInstances) window.hlsInstances = {};
            if (Hls.isSupported() && url.includes('.m3u8')) {
                if (window.hlsInstances[index]) window.hlsInstances[index].destroy();
                const hls = new Hls();
                window.hlsInstances[index] = hls;
                hls.loadSource(url);
                hls.attachMedia(videoElement);
                hls.on(Hls.Events.MANIFEST_PARSED, () => videoElement.play());
            } else {
                videoElement.src = url;
                videoElement.play();
            }
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            stopAllPlayers();
            filterChannels();
        });
        
        document.getElementById('groupSelect').addEventListener('change', function() {
            stopAllPlayers();
            localStorage.setItem('iptv_selected_group', this.value);
            filterChannels();
        });

        function filterChannels() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const group = document.getElementById('groupSelect').value;

            filteredChannelsCache = channels.filter(channel => {
                const matchesSearch = channel.name.toLowerCase().includes(search);
                const matchesGroup = group === '' || channel.group === group;
                return matchesSearch && matchesGroup;
            });

            renderChannels(filteredChannelsCache);
        }

        initApp();
    </script>
</body>
</html>
